<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanishk Narula</title>
    <meta
      name="description"
      content="Tanishk Narula — machine learning and systems engineering. Site under construction."
    />
    <link rel="canonical" href="https://imtani.dev/" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <style>
      /* Deliberately plain. The visual language for this site is not decided,
         and a holding page is the wrong place to decide it — anything with a
         point of view here would be a claim the real site then has to honour.
         System type, one column, no motion. Replace wholesale, do not extend. */
      :root {
        color-scheme: light dark;
        --paper: #fbfaf8;
        --ink: #16181c;
        --ink-2: #5c626b;
        --rule: #e2e0dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #111214;
          --ink: #e8e6e3;
          --ink-2: #8d9299;
          --rule: #26282c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: var(--paper);
        color: var(--ink);
        font: 400 clamp(15px, 1.1vw + 12px, 17px) / 1.6 ui-sans-serif, system-ui,
          -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 34rem;
        width: 100%;
      }
      h1 {
        font-size: clamp(1.6rem, 3vw + 1rem, 2.4rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--ink-2);
        text-wrap: pretty;
      }
      .lede {
        color: var(--ink);
      }
      ul {
        list-style: none;
        margin: 1.75rem 0 0;
        padding: 1.25rem 0 0;
        border-top: 1px solid var(--rule);
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        font-size: 0.95em;
      }
      a {
        color: var(--ink);
        text-decoration-color: var(--ink-2);
        text-underline-offset: 0.2em;
      }
      a:hover {
        text-decoration-color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tanishk Narula</h1>
      <p class="lede">Still building this.</p>
      <p>
        Machine learning and systems engineering. Currently at AiHello, and
        co-founding <a href="https://smoothsend.xyz">SmoothSend</a>.
      </p>
      <ul>
        <li><a href="mailto:hey@imtani.dev">hey@imtani.dev</a></li>
        <li><a href="https://github.com/ImTani">github.com/ImTani</a></li>
        <li>
          <a href="https://github.com/ImTani/imtani.dev">source for this site</a>
        </li>
      </ul>
    </main>
  </body>
</html>
