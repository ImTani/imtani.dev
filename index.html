<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>substrate — engine harness</title>
    <style>
      /* Intentionally styleless. This page is a test harness for the
         simulation engine, not a draft of the site. Nothing here is a design
         decision and none of it should be carried forward. */
      body {
        margin: 0;
        background: #141414;
        color: #b8b8b8;
        font: 13px/1.5 ui-monospace, monospace;
        padding: 16px;
      }
      canvas {
        width: 100%;
        max-width: 960px;
        image-rendering: pixelated;
        display: block;
        border: 1px solid #333;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 16px;
        max-width: 960px;
        margin: 12px 0 0;
      }
      dt {
        color: #6c6c6c;
      }
      dd {
        margin: 0;
      }
      p {
        max-width: 960px;
        color: #6c6c6c;
      }
      button {
        font: inherit;
        background: #222;
        color: inherit;
        border: 1px solid #3a3a3a;
        padding: 4px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>Engine harness — unstyled on purpose. Visual language not yet decided.</p>
    <canvas id="view"></canvas>
    <p>
      <button id="fast">run fast (1 step/frame)</button>
      <button id="real">real time (1 step/min)</button>
    </p>
    <dl id="stats"></dl>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
