# Weekly rebake and deploy.
#
# This is architecture, not housekeeping. The substrate is a pure function of
# (seed, epoch, now), so a visitor's browser must simulate every step between
# the last baked checkpoint and the moment they arrive. Measured on the
# reference machine at 192x120:
#
#   57.8 microseconds per step, measured at 192x120
#
# Catch-up cost therefore grows with the age of the site, not with how long any
# individual visitor has been away, and it scales with the tick rate. At one
# second per step:
#
#   six hours    21,600 steps    1.2 s
#   one day      86,400 steps    5.0 s
#   one week    604,800 steps   35.0 s
#
# Six-hourly is what keeps that first row true. The client advances in bounded
# chunks across frames rather than blocking, so 1.2 s is a visible fast-forward
# and not a stall — but if this workflow stops running, the fast-forward grows
# every six hours and nothing else will report it.

name: rebake

on:
  schedule:
    # Every six hours. See the note above: this interval is the bound on
    # worst-case catch-up, not a housekeeping cadence.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebake
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The bake resumes from the previous snapshot, so this cache is what
      # stops CI recomputing the world from the epoch on every run — a cost
      # that grows with the age of the site, not with the rebake interval.
      # A miss is correct but slow; it degrades to a full replay rather than
      # to a wrong world. The permanent fix once the site is deployed is to
      # resume from the live checkpoint instead of from CI state.
      - name: Restore world snapshot
        uses: actions/cache@v4
        with:
          path: src/generated
          key: world-${{ github.run_id }}
          restore-keys: world-

      # Guard the deploy: a snapshot is only a shortcut to the current world if
      # the engine still produces that world. Shipping a stale checkpoint would
      # be worse than shipping none.
      - name: Test
        run: npm test

      # `npm run build` bakes the checkpoint as its first step, so the snapshot
      # is produced here and shipped in the bundle. It is never committed —
      # regenerating it is deterministic, and committing it would diff the
      # entire grid on every run.
      - name: Build with a fresh checkpoint
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
