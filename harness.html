<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>engine harness — imtani.dev</title>
    <style>
      /* Intentionally styleless. This page is a test harness for the
         simulation engine, not a draft of the site. Nothing here is a design
         decision and none of it should be carried forward. */
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: #141414;
        color: #b8b8b8;
        font: 13px/1.5 ui-monospace, monospace;
        padding: 16px;
      }
      .note { color: #6c6c6c; max-width: 1100px; margin: 0 0 12px; }
      #view {
        width: 100%;
        max-width: 1100px;
        aspect-ratio: 192 / 120;
        display: block;
        border: 1px solid #333;
        cursor: crosshair;
        touch-action: none;
      }
      .controls { margin: 12px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        font: inherit;
        background: #222;
        color: inherit;
        border: 1px solid #3a3a3a;
        padding: 4px 10px;
        cursor: pointer;
      }
      button[aria-pressed='true'] { background: #3a3a3a; color: #fff; }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 16px;
        max-width: 1100px;
        margin: 14px 0 0;
      }
      dt { color: #6c6c6c; }
      dd { margin: 0; }
    </style>
  </head>
  <body>
    <p class="note">
      Engine harness — unstyled on purpose. Visual language not yet decided.
      Move the cursor over the canvas. Hold still near the creature to earn its
      trust; flick the cursor at it to startle it.
    </p>

    <canvas id="view"></canvas>

    <div class="controls">
      <button id="real" aria-pressed="true">real time (substrate 1 step/sec)</button>
      <button id="fast" aria-pressed="false">fast (1 step/frame, ~60x)</button>
      <button id="trust-up">+ trust</button>
      <button id="trust-reset">reset trust</button>
    </div>

    <dl id="stats"></dl>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
